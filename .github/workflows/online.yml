name: Online

on:
  push:
    branches: [main]
    paths:
      - "online/server/**"
      - ".github/workflows/online.yml"
  pull_request:
    paths:
      - "online/server/**"
      - ".github/workflows/online.yml"
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: online/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: online/server/package-lock.json
      - run: npm ci
      - name: Tests du serveur des salons
        run: npm test
